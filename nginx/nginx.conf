# =====================================================================
#  API GATEWAY (Nginx como reverse proxy) - punto de entrada unico
#  Todo entra por http://localhost (puerto 80) y Nginx lo reparte:
#
#    /                 -> frontend        (React)
#    /api/auth/...     -> servicio-python (login, sesion)         [publico]
#    /api/usuarios     -> servicio-python (FastAPI)               [requiere sesion]
#    /api/productos    -> servicio-node   (Express)               [requiere sesion]
#    /api/movimientos  -> servicio-node   (Express)               [requiere sesion]
#    /api/ordenes      -> servicio-java   (Spring Boot)           [requiere sesion]
#    /api/reportes     -> servicio-go     (Gin)                   [requiere sesion]
#    /api/health/xxx   -> /health de cada servicio                [publico]
#
#  AUTENTICACION CENTRALIZADA: antes de reenviar una peticion protegida,
#  Nginx hace una sub-peticion a servicio-python (/auth/verificar) con el
#  token. Si responde 200 continua, si responde 401/403 corta la peticion.
#  Asi los microservicios no tienen que validar tokens cada uno.
# =====================================================================
events {}

http {
  # DNS interno de Docker: traduce "servicio-python" a la IP del contenedor
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Cada "upstream" es un grupo de servidores. Se usan los NOMBRES de docker-compose.
  # "resolve" (+ "zone") hace que Nginx vuelva a buscar la IP si un contenedor se
  # reinicia y cambia de direccion, sin tener que reiniciar el gateway.
  upstream python_svc   { zone python_svc 64k;   server servicio-python:8000 resolve; }
  upstream node_svc     { zone node_svc 64k;     server servicio-node:3000   resolve; }
  upstream java_svc     { zone java_svc 64k;     server servicio-java:8080   resolve; }
  upstream go_svc       { zone go_svc 64k;       server servicio-go:8080     resolve; }
  upstream frontend_svc { zone frontend_svc 64k; server frontend:80          resolve; }

  # Formato del log: se ve en "docker compose logs gateway"
  log_format gateway '$remote_addr [$request_id] "$request" -> $upstream_addr [$status] $request_time s';
  access_log /dev/stdout gateway;

  # Limite de intentos de login por IP (proteccion contra fuerza bruta)
  limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
  limit_req_status 429;

  gzip on;
  gzip_types application/json text/css application/javascript image/svg+xml;
  client_max_body_size 1m;

  # Si un servicio no contesta, fallar rapido en vez de dejar la pagina esperando
  proxy_connect_timeout 3s;
  proxy_read_timeout 30s;
  server_tokens off;

  server {
    listen 80;

    # Cabeceras comunes para todos los proxies
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id      $request_id;
    # Datos del usuario autenticado (los rellena auth_request; el cliente NO puede falsificarlos
    # porque Nginx siempre reemplaza estas cabeceras)
    proxy_set_header X-Usuario-Id      $usuario_id;
    proxy_set_header X-Usuario-Rol     $usuario_rol;
    proxy_set_header X-Usuario-Nombre  $usuario_nombre;

    add_header X-Gateway "nginx-mercaujap" always;
    add_header X-Request-Id $request_id always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # Valores por defecto (vacio = la cabecera no se envia)
    set $usuario_id "";
    set $usuario_rol "";
    set $usuario_nombre "";

    # ---------- Sub-peticion interna de autenticacion ----------
    location = /_auth {
      internal;
      proxy_pass http://python_svc/auth/verificar;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Original-Method $request_method;
      proxy_set_header X-Original-URI $request_uri;
    }

    # ---------- Publico: login y sesion ----------
    location = /api/auth/login {
      limit_req zone=login burst=5 nodelay;
      proxy_pass http://python_svc/auth/login;
    }
    location /api/auth/ {
      proxy_pass http://python_svc/auth/;
    }

    # ---------- Protegido: requiere token valido ----------
    # /api/usuarios/5  ->  http://servicio-python:8000/usuarios/5
    location /api/usuarios {
      auth_request /_auth;
      auth_request_set $usuario_id $upstream_http_x_usuario_id;
      auth_request_set $usuario_rol $upstream_http_x_usuario_rol;
      auth_request_set $usuario_nombre $upstream_http_x_usuario_nombre;
      proxy_pass http://python_svc/usuarios;
    }

    # /api/productos/abc  ->  http://servicio-node:3000/productos/abc
    location /api/productos {
      auth_request /_auth;
      auth_request_set $usuario_id $upstream_http_x_usuario_id;
      auth_request_set $usuario_rol $upstream_http_x_usuario_rol;
      auth_request_set $usuario_nombre $upstream_http_x_usuario_nombre;
      proxy_pass http://node_svc/productos;
    }

    # /api/movimientos  ->  http://servicio-node:3000/movimientos
    location /api/movimientos {
      auth_request /_auth;
      auth_request_set $usuario_id $upstream_http_x_usuario_id;
      auth_request_set $usuario_rol $upstream_http_x_usuario_rol;
      auth_request_set $usuario_nombre $upstream_http_x_usuario_nombre;
      proxy_pass http://node_svc/movimientos;
    }

    # /api/ordenes/1  ->  http://servicio-java:8080/ordenes/1
    location /api/ordenes {
      auth_request /_auth;
      auth_request_set $usuario_id $upstream_http_x_usuario_id;
      auth_request_set $usuario_rol $upstream_http_x_usuario_rol;
      auth_request_set $usuario_nombre $upstream_http_x_usuario_nombre;
      proxy_pass http://java_svc/ordenes;
    }

    # /api/reportes/resumen  ->  http://servicio-go:8080/reportes/resumen
    location /api/reportes {
      auth_request /_auth;
      auth_request_set $usuario_id $upstream_http_x_usuario_id;
      auth_request_set $usuario_rol $upstream_http_x_usuario_rol;
      auth_request_set $usuario_nombre $upstream_http_x_usuario_nombre;
      proxy_pass http://go_svc/reportes;
    }

    # ---------- Estado (health check) de cada microservicio ----------
    location = /api/health/python { proxy_pass http://python_svc/health; }
    location = /api/health/node   { proxy_pass http://node_svc/health;   }
    location = /api/health/java   { proxy_pass http://java_svc/health;   }
    location = /api/health/go     { proxy_pass http://go_svc/health;     }
    location = /api/health/gateway {
      default_type application/json;
      return 200 '{"status":"ok","servicio":"gateway","tecnologia":"Nginx"}';
    }

    location /api/ {
      default_type application/json;
      return 404 '{"error":"Ruta de la API no encontrada"}';
    }

    # ---------- Respuestas de error en JSON ----------
    # (solo para errores que genera el propio Nginx; los de los servicios pasan tal cual)
    error_page 401 = @no_autenticado;
    error_page 403 = @prohibido;
    error_page 429 = @demasiados_intentos;
    error_page 500 502 503 504 = @servicio_caido;

    location @no_autenticado {
      default_type application/json;
      return 401 '{"error":"Tu sesión no es válida o expiró. Inicia sesión de nuevo"}';
    }
    location @prohibido {
      default_type application/json;
      return 403 '{"error":"No tienes permisos para realizar esta acción"}';
    }
    location @demasiados_intentos {
      default_type application/json;
      return 429 '{"error":"Demasiados intentos. Espera un minuto e intenta de nuevo"}';
    }
    location @servicio_caido {
      default_type application/json;
      return 503 '{"error":"El servicio no está disponible en este momento. Intenta de nuevo en unos segundos"}';
    }

    # Todo lo demas -> frontend
    location / {
      proxy_pass http://frontend_svc;
    }
  }
}
