# Nginx del FRONTEND: sirve los archivos estaticos (index.html, style.css, app.js).
# Si abres el frontend directo en http://localhost:3000, las llamadas a /api/...
# se reenvian al API Gateway para que todo siga funcionando.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    # "resolver" + variable: Nginx busca el gateway cuando llega la peticion,
    # asi el frontend arranca aunque el gateway todavia no exista.
    resolver 127.0.0.11 valid=10s;
    set $gateway http://gateway:80;
    proxy_pass $gateway;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
