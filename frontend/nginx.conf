# Nginx del FRONTEND: sirve la aplicacion React ya compilada (carpeta dist).
# No tiene puerto publicado: se llega a el a traves del API Gateway (http://localhost:8080),
# que tambien atiende las llamadas a /api/...
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml;

  # Archivos con hash en el nombre: se pueden guardar en cache por mucho tiempo
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Rutas de la aplicacion (/pedidos, /clientes/...) -> index.html (React Router)
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
