# Nginx del FRONTEND: sirve la aplicacion React ya compilada (carpeta dist).
# Si abres el frontend directo en http://localhost:3000, las llamadas a /api/...
# se reenvian al API Gateway para que todo siga funcionando.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml;

  location /api/ {
    # "resolver" + variable: Nginx busca el gateway cuando llega la peticion,
    # asi el frontend arranca aunque el gateway todavia no exista.
    resolver 127.0.0.11 valid=10s;
    set $gateway http://gateway:80;
    proxy_pass $gateway;
  }

  # Archivos con hash en el nombre: se pueden guardar en cache por mucho tiempo
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Rutas de la aplicacion (/pedidos, /clientes/...) -> index.html (React Router)
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
