# Spring Boot lee las variables de entorno con ${NOMBRE:valor_por_defecto}
server.port=${PORT:8080}

# --- Base de datos (PostgreSQL) ---
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/ordenes_db}
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASS:supersecreta}

# update => Hibernate crea/actualiza las tablas a partir de las clases @Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- URLs de los otros microservicios (comunicacion entre servicios) ---
servicios.usuarios.url=${USUARIOS_SERVICE_URL:http://localhost:8001}
servicios.productos.url=${PRODUCTOS_SERVICE_URL:http://localhost:8002}
